name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev,bench]"

      - name: Run tests
        run: python -m pytest -q

      - name: Cross-check frozen RLVR result receipts
        run: python scripts/verify_rlvr_v2_receipts.py

      - name: Build generalization scorecard
        run: |
          python scripts/build_generalization_scorecard.py \
            --output-dir /tmp/l20_codeforge_scorecard_ci

      - name: Verify benchmark artifact hashes
        run: python -m l20_codeforge verify-artifacts
